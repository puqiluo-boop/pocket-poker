; --- TRULY GLOBAL SETTINGS ---
; These apply to everything: ESP32s and Desktop Native.
[env]
build_flags = 
    -I include
    -std=gnu++17
build_unflags = 
    -std=gnu++11

; --- ESP32 HARDWARE BASE ---
; This is a custom template. It does not run on its own.
[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32-s3-devkitc-1

; Memory Settings
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; Hardware Build Flags
build_flags = 
    ${env.build_flags} ; Grab the global flags first
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE

; Hardware Dependencies
lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
    lvgl/lvgl @ 8.3.11

; --- DEALER ENVIRONMENT ---
[env:dealer]
extends = esp32_base
build_src_filter = -<*> +<dealer-module/>

; --- PLAYER ENVIRONMENT ---
[env:player]
extends = esp32_base
build_src_filter = -<*> +<player-module/>

; --- NATIVE ENVIRONMENT ---
[env:native]
platform = native
test_framework = unity
